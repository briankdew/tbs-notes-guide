<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Home-screen setup: open full-screen, short name, and icon -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TBS Notes">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>TBS Notes That Hold Up</title>
<style>
  :root { --navy:#1e2a36; --cream:#f7f4ee; --accent:#e8a47e; --muted:#c9d3dc; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--navy); color:var(--cream);
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; }
  #stage { width:min(100%, calc((100dvh - 110px) * 16 / 9)); aspect-ratio:16 / 9; background:#000;
    border-radius:8px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.4); touch-action:pan-y pinch-zoom; }
  #slide { width:100%; height:100%; object-fit:contain; display:block; }
  #bar { width:min(100%, max(calc((100dvh - 110px) * 16 / 9), 560px)); display:flex; align-items:center; gap:10px; }
  #hint { display:none; margin:0; color:var(--cream); font-size:15px; text-align:center; }
  button { font:inherit; font-size:16px; min-height:44px; padding:10px 18px; cursor:pointer; white-space:nowrap;
    background:transparent; color:var(--cream); border:1.5px solid rgba(247,244,238,.35); border-radius:999px; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.35; cursor:default; }
  #next { background:var(--accent); border-color:var(--accent); color:var(--navy); font-weight:700; }
  #next:hover:not(:disabled) { color:var(--navy); filter:brightness(1.08); }
  #progress { flex:1; height:6px; background:rgba(247,244,238,.15); border-radius:3px; overflow:hidden; }
  #fill { height:100%; width:0; background:var(--accent); transition:width .3s; }
  #count { font-variant-numeric:tabular-nums; color:var(--muted); font-size:15px; min-width:58px; text-align:right; }
  #start { position:fixed; inset:0; z-index:10; background:var(--navy); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; padding:24px; text-align:center; }
  #start h1 { font-family:Georgia, "Times New Roman", serif; font-size:clamp(28px, 5vw, 48px); margin:0; }
  #start p { color:var(--muted); margin:0; max-width:34em; line-height:1.5; }
  #start button { background:var(--accent); border:none; color:var(--navy); font-weight:700; font-size:18px; padding:14px 30px; }
  /* Phone held upright: controls wrap under the slide, plus a hint to turn sideways */
  @media (max-width:600px) {
    #bar { flex-wrap:wrap; }
    #progress { order:-2; flex-basis:calc(100% - 70px); }
    #count { order:-1; }
    button { flex:1; padding:10px 12px; }
    #play { flex:1.6; }
    #hint { display:block; }
  }
  /* Phone held sideways: controls move to a narrow column beside the slide */
  @media (orientation:landscape) and (max-height:540px) {
    body { flex-direction:row; gap:12px; padding:8px 12px; }
    #stage { width:min(calc(100vw - 176px), calc((100dvh - 16px) * 16 / 9)); border-radius:6px; }
    #bar { width:128px; flex-direction:column; align-items:stretch; gap:8px; }
    #progress { display:none; }
    #count { order:-3; text-align:center; min-width:0; }
    #next { order:-2; }
    #play { order:-1; }
    button { font-size:15px; padding:8px 10px; }
  }
</style>
</head>
<body>
  <div id="start">
    <h1>TBS Notes That Hold Up</h1>
    <p>Each slide has a short spoken introduction. Read the slide at your own pace, then tap Next when you’re ready. Please turn your sound on. On a phone, turn it sideways for a larger view.</p>
    <button id="begin">Start the guide</button>
  </div>

  <p id="hint">Turn your phone sideways for a larger view.</p>
  <div id="stage"><img id="slide" alt=""></div>
  <div id="bar">
    <button id="prev" aria-label="Previous slide">◀ Back</button>
    <button id="play">❚❚ Pause</button>
    <div id="progress"><div id="fill"></div></div>
    <span id="count"></span>
    <button id="next" aria-label="Next slide">Next ▶</button>
  </div>

<script>
  const TOTAL = 20;
  const pad = n => String(n).padStart(2, '0');
  const $ = id => document.getElementById(id);
  const img = $('slide'), playBtn = $('play'), audio = new Audio();
  let current = 1;

  function show(n) {
    current = Math.min(Math.max(n, 1), TOTAL);
    img.src = `slides/slide-${pad(current)}.png`;
    img.alt = `Slide ${current} of ${TOTAL}`;
    audio.src = `audio/slide-${pad(current)}.mp3`;
    audio.play().catch(() => {});            // narration starts with each new slide
    $('prev').disabled = current === 1;
    $('next').disabled = current === TOTAL;
    $('count').textContent = `${current} / ${TOTAL}`;
    $('fill').style.width = `${(current / TOTAL) * 100}%`;
    if (current < TOTAL) new Image().src = `slides/slide-${pad(current + 1)}.png`;  // preload next
  }

  function togglePlay() { audio.paused ? audio.play().catch(() => {}) : audio.pause(); }

  audio.addEventListener('play',  () => playBtn.textContent = '❚❚ Pause');
  audio.addEventListener('pause', () => playBtn.textContent = audio.ended ? '↻ Replay' : '▶ Play');

  $('begin').addEventListener('click', () => { $('start').remove(); show(1); });
  $('prev').addEventListener('click', () => show(current - 1));
  $('next').addEventListener('click', () => show(current + 1));
  playBtn.addEventListener('click', togglePlay);

  document.addEventListener('keydown', e => {
    if ($('start')) return;
    if (e.key === 'ArrowRight') show(current + 1);
    else if (e.key === 'ArrowLeft') show(current - 1);
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });

  let touchX = null;                          // swipe left/right on phones
  $('stage').addEventListener('touchstart', e => touchX = e.touches[0].clientX, { passive:true });
  $('stage').addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
    touchX = null;
  });
</script>
</body>
</html>
